name: Publicar inventario

on:
  repository_dispatch:
    types: [drive-changed]       # lo dispara el vigilante de Google Drive (Apps Script)
  push:
    branches: [main]             # cambios de diseño/código
  schedule:
    - cron: "17 */6 * * *"       # red de seguridad: cada 6 horas
  workflow_dispatch: {}          # botón "Run workflow" manual

concurrency:
  group: deploy                  # nunca dos publicaciones a la vez; la nueva espera a la anterior
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Descargar documentos de Google Drive
        run: node scripts/sync-drive.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}

      - name: Construir (QR, fichas, WebP, pre-renderizado)
        run: node build.mjs

      - name: Publicar en Cloudflare
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
